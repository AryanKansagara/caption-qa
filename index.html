<!doctype html>
<html lang="en" data-default-mode="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Caption QA: subtitle quality control for every language</title>
    <meta name="description" content="Check SRT, VTT, ASS, TTML and SBV subtitles against Netflix-style and BBC-style rules: reading speed, line length, timing, shot changes and translation. Auto-fix with review, batch QC by language and printable reports." />
    <meta name="theme-color" content="#00c4ff" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23f3a6ff'/><stop offset='.65' stop-color='%2300c4ff'/><stop offset='1' stop-color='%2335c838'/></linearGradient></defs><rect width='32' height='32' rx='8' fill='url(%23g)'/><text x='16' y='21.5' font-family='Arial,sans-serif' font-size='13' font-weight='900' text-anchor='middle' fill='%230a0c10'>CQ</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      (function () {
        var q = new URLSearchParams(location.search).get('mode')
        var m = q === 'light' || q === 'dark' ? q : localStorage.getItem('themeMode')
        document.documentElement.dataset.themeMode = m === 'light' || m === 'dark' ? m : document.documentElement.dataset.defaultMode
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
